[package]
name = "auth-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
jsonwebtoken = "11.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = {version = "=0.9.0", features = ["runtime-tokio", "tls-native-tls", "macros", "chrono"]}
tokio = {version= "1.53.2", features=["full"]}
tower = "0.5.3"
tower-http = {version = "0.7.1", features = ["trace", "cors"]}
uuid = {version = "1.28.0", features = ["v4"]}

[features]
default = ["postgres"] # Cargo will run this automatically if no flag is provided
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]
